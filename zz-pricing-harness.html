<!doctype html>
<html><head><meta charset="utf-8" /><title>harness</title></head>
<body style="background:#000;margin:0">
<div id="root"></div>
<script type="module">
import './src/index.css';
import React, { useState } from 'react';
import { createRoot } from 'react-dom/client';
import { PriceRow, BundleRows, PRICE_GROUP } from './src/components/admin/PricingRows';
function App() {
  const [single, setSingle] = useState(10);
  const [bundles, setBundles] = useState([{ photo_count: 4, price: 25 }, { photo_count: 10, price: 50 }, { photo_count: 50, price: 100 }, { photo_count: 3, price: 40 }]);
  const [album, setAlbum] = useState(150);
  const h = React.createElement;
  return h('div', { style: { maxWidth: 1180, margin: '40px auto' }, className: 'bg-white/5 p-3 space-y-3' },
    h('p', { className: PRICE_GROUP }, 'À la carte buyers'),
    h(PriceRow, { label: 'Per photo', value: single, onChange: v => setSingle(v === '' ? 0 : v) }),
    h(BundleRows, { single, bundles: bundles.map((b, i) => ({ ...b, i })),
      onChange: (i, p) => setBundles(bundles.map((x, j) => j === i ? { ...x, ...p } : x)),
      onRemove: i => setBundles(bundles.filter((_, j) => j !== i)),
      onAdd: () => setBundles([...bundles, { photo_count: 4, price: 10 }]) }),
    h(PriceRow, { label: 'Whole album', value: album, onChange: setAlbum, placeholder: 'Off', count: 120, single }));
}
createRoot(document.getElementById('root')).render(h(App));
</script>
</body></html>
